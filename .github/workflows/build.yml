name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26.x

    - name: Set up protoc
      run: |
        wget https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-linux-x86_64.zip
        unzip protoc-28.3-linux-x86_64.zip
        sudo mv bin/protoc /usr/local/bin/protoc
        sudo mv include/* /usr/local/include/

    - name: Install protoc-gen-go
      run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.28.1

    - name: Generated protofiles are up to date
      run: |
        make generate-protos
        git diff --exit-code

    - name: No formatting changes
      run: |
        make format
        git diff --exit-code

    - name: Install ZMQ
      run: sudo apt update -y && sudo apt upgrade -y && sudo apt install libsodium-dev libzmq3-dev
    
    - name: Setup golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2

    - name: Linter passes
      run: make linters

    - name: Test
      run: make test

    - name: Build production container
      run: docker build --tag fleet-telemetry:test --file Dockerfile .

    - name: Build Railway container
      run: docker build --tag fleet-telemetry:railway-test --file Dockerfile.railway .

    - name: Validate proxy entrypoint
      run: sh -n deploy/proxy-entrypoint.sh

    - name: Build Vehicle Command Proxy container
      run: docker build --tag vehicle-command-proxy:test --file Dockerfile.proxy .

    - name: Integration Test
      run: make integration
